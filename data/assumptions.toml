# CoreWeave model assumptions
# ---------------------------
# Every number the model uses lives here, with its source, so nothing is hidden in the code.
# Units: US dollars in MILLIONS unless the name says otherwise (e.g. 5131 = $5.131 billion).
# Percentages are written as decimals (0.67 = 67%).
#
# Sources:
#   [10-K FY25]  CoreWeave annual report for 2025, filed with the SEC (Feb 2026)
#   [Q4 FY25 PR] CoreWeave Q4 & full-year 2025 results press release (26 Feb 2026)
#   [Q2 FY26 PR] CoreWeave Q2 2026 results press release (11 Aug 2026)
#   [Q2 FY26 call] Guidance given on the Q2 2026 earnings call, as reported in press coverage
#   [10-Q Q2 FY26] CoreWeave quarterly report for the quarter ended 30 June 2026, filed with the SEC
#   (10-K "Note 5" etc. = the numbered notes to the financial statements inside the 10-K)


[revenue]
# What CoreWeave has actually earned (its "top line").

fy2023_actual = 229   # [10-K FY25] Business section
fy2024_actual = 1915  # [Q4 FY25 PR]
fy2025_actual = 5131  # [Q4 FY25 PR]

q2_2025_actual = 1212 # [Q2 FY26 PR] same quarter last year, for comparison
q2_2026_actual = 2575 # [Q2 FY26 PR] most recent quarter

# Management's forecast for full-year 2026 (a low and a high estimate).
fy2026_guidance_low  = 12400 # [Q2 FY26 call]
fy2026_guidance_high = 13200 # [Q2 FY26 call]


[backlog]
# Backlog = revenue customers have already signed contracts for but CoreWeave hasn't earned yet.
# It matters for credit risk because it's the "visible" future cash that lenders lean on.

total_backlog_2025_12_31 = 66800  # [Q4 FY25 PR] company's headline "revenue backlog"
total_backlog_2026_06_30 = 104000 # [Q2 FY26 PR] "approximately $104 billion"

# RPO (remaining performance obligations) = the strict accounting version of backlog.
rpo_2025_12_31 = 60700 # [10-K FY25] Note 2, Remaining Performance Obligations

# When the RPO turns into revenue (shares of the $60.7B; they add up to 100%).
rpo_share_months_1_to_24  = 0.43 # [10-K FY25] Note 2: recognized by 31 Dec 2027
rpo_share_months_25_to_48 = 0.38 # [10-K FY25] Note 2
rpo_share_months_49_to_84 = 0.19 # [10-K FY25] Note 2: "remaining balance"

weighted_avg_contract_years = 5 # [10-K FY25] Business section: "approximately five years"


[customers]
# Customer concentration = how much revenue depends on a few big customers.
# This drives our "customer loss" stress test: if Microsoft leaves, how much revenue disappears?

microsoft_share_of_fy2025_revenue = 0.67 # [10-K FY25] Risk Factors: "approximately 67%" from top customer, Microsoft

# Large newer contracts (total value over the contract life, not per year).
# The 10-K says each is expected to become a "significant customer".
openai_contract_value = 6500 # [10-K FY25] Risk Factors: "up to approximately $6.5 billion through May 31, 2031" (Sept 2025 order)
meta_contract_value   = 14200 # [10-K FY25] Risk Factors: "initially committed ... up to approximately $14.2 billion through December 2031"


[operating_costs]
# FY2025 expenses from the income statement. NOTE: these INCLUDE depreciation and
# stock-based compensation, which are not cash going out the door this year.

cost_of_revenue_fy2025            = 1453 # [10-K FY25] MD&A results table: data center rent, power, staff
technology_and_infrastructure_fy2025 = 2929 # [10-K FY25] MD&A results table: mostly server/GPU depreciation
sales_and_marketing_fy2025        = 144  # [10-K FY25] MD&A results table
general_and_administrative_fy2025 = 651  # [10-K FY25] MD&A results table
total_operating_expenses_fy2025   = 5177 # [10-K FY25] MD&A results table (revenue 5131 - 5177 = operating loss of 46)

# Stock-based compensation: paying staff in shares. A real cost to shareholders, but not cash.
stock_based_comp_fy2025 = 630 # [10-K FY25] MD&A table: 15 + 221 + 31 + 363 across the four lines

# Adjusted EBITDA = earnings before interest, tax, depreciation and amortization (and SBC).
# A rough measure of the cash the business generates before paying for debt and new equipment.
adjusted_ebitda_fy2025        = 3093 # [Q4 FY25 PR]
adjusted_ebitda_margin_fy2025 = 0.60 # [Q4 FY25 PR] 3093 / 5131
adjusted_ebitda_q2_2026        = 1510 # [Q2 FY26 PR]
adjusted_ebitda_margin_q2_2026 = 0.59 # [Q2 FY26 PR]


[depreciation]
# Depreciation = spreading the cost of equipment over the years it's useful.
# This is the heart of the "GPU depreciation" stress test.

gpu_useful_life_years = 6 # [10-K FY25] Note 1: "Technology equipment 6 years" (raised from 5 years in Jan 2023)
previous_gpu_useful_life_years = 5 # [10-K FY25] Note 1: the estimate before 1 Jan 2023

depreciation_and_amortization_fy2025 = 2454 # [10-K FY25] cash flow statement (2,454; FY2024 was 863)

# What the equipment is worth on the balance sheet at 31 Dec 2025.
technology_equipment_gross_2025_12_31 = 20903 # [10-K FY25] Note 5: GPUs, servers, networking at original cost
construction_in_progress_2025_12_31   = 9376  # [10-K FY25] Note 5: bought/being built, not yet in use (not yet depreciating)
total_ppe_gross_2025_12_31            = 33941 # [10-K FY25] Note 5: all property & equipment at original cost
accumulated_depreciation_2025_12_31   = 3384  # [10-K FY25] Note 5: total depreciation charged so far
total_ppe_net_2025_12_31              = 30557 # [10-K FY25] Note 5: 33,941 - 3,384


[capex]
# Capex (capital expenditure) = cash spent buying GPUs, servers and data-center equipment.
# CoreWeave borrows heavily to fund this, which is why it matters for credit risk.

cash_capex_fy2024 = 8700  # [10-K FY25] Liquidity section: "$8.7 billion"
cash_capex_fy2025 = 10300 # [10-K FY25] Liquidity section: "$10.3 billion"
cash_capex_q2_2026 = 6422 # [Q2 FY26 PR] "purchases of property and equipment"
# (Press coverage quotes Q2 2026 capex of ~$9.4B; that wider measure includes equipment
#  received but not yet paid for. We use the cash figure.)

fy2026_capex_guidance_low  = 35000 # [Q2 FY26 call] raised from $31-35B on the Q1 call
fy2026_capex_guidance_high = 39000 # [Q2 FY26 call]


[debt_summary]
# How much CoreWeave owes, and what it has to pay with. All figures at 30 June 2026.

total_debt_principal_2026_06_30 = 35551 # [10-Q Q2 FY26] Note 10: sum of the future principal payments
total_debt_principal_2025_12_31 = 21615 # [10-K FY25] Note 10: "Total principal of debt"

cash_2026_06_30 = 5524 # [Q2 FY26 PR] balance sheet: cash and cash equivalents
restricted_cash_2026_06_30 = 1380 # [Q2 FY26 PR] 873 current + 507 non-current; locked up for lenders, NOT free to spend

# Revolving credit facility = a corporate credit card: borrow, repay, borrow again, up to a limit.
revolver_size = 2500 # [10-Q Q2 FY26] MD&A: "$2.5 billion Revolving Credit Facility"
revolver_undrawn_2026_06_30 = 2000 # [10-Q Q2 FY26] Note 10: "$2.0 billion of remaining capacity" (nothing drawn)

# Interest actually owed on the debt ("contractual" = what the loan agreements say).
contractual_interest_fy2025 = 1220 # [10-K FY25] Note 10 interest table
contractual_interest_h1_2026 = 1075 # [10-Q Q2 FY26] Note 10: six months to 30 June 2026
contractual_interest_q2_2026 = 592  # [10-Q Q2 FY26] Note 10: three months to 30 June 2026

# Operating leases = long-term rent on data centers. Not counted as "debt" above, but they are
# fixed payments CoreWeave must make, so credit analysts often treat them like debt.
operating_lease_liabilities_2026_06_30 = 16319 # [Q2 FY26 PR] balance sheet, current + non-current
operating_lease_liabilities_2025_12_31 = 8195  # [Q2 FY26 PR] balance sheet, current + non-current

# Covenants = rules in the loan agreements (e.g. minimum cash, maximum debt vs earnings).
# The 10-K says CoreWeave must meet "specified financial covenant ratios" but doesn't publish them,
# so in Phase 4 we'll set our own default rules and label them as OUR assumptions.


[debt_maturities]
# When the $35.6B of principal has to be repaid (or refinanced = replaced with new borrowing).
# A big year here is a "maturity wall", the moment refinancing risk bites hardest.
# [10-Q Q2 FY26] Note 10: future principal payments as of 30 June 2026

remaining_2026 = 4413 # July-December 2026 only
y2027 = 6184
y2028 = 4416
y2029 = 2421
y2030 = 3221
thereafter = 14896 # 2031 and later


# ---------------------------------------------------------------------------------------------
# Individual loans at 30 June 2026. Each [[debt_facilities]] block is one loan.
# [10-Q Q2 FY26] Note 10 debt table, unless noted otherwise.
#
#   principal       = amount owed today ($ millions)
#   effective_rate  = all-in yearly interest cost incl. fees, from the 10-Q table (0.10 = 10%)
#   floating_share  = share of the loan whose rate moves with SOFR (1 = fully floating, 0 = fixed)
#                     The 10-K says "all of the debt under our Credit Facilities [the DDTLs and
#                     revolver] bears interest at variable rates, the majority of which is unhedged."
#   recourse        = true if CoreWeave itself must repay; false if lenders can only take the
#                     specific GPUs/assets securing the loan
#
# DDTL = "delayed draw term loan": a loan CoreWeave draws in chunks as it buys GPUs, with the
# GPUs as collateral, then repays in instalments.
# ---------------------------------------------------------------------------------------------

[[debt_facilities]]
name = "DDTL 1.0"
principal = 1300
effective_rate = 0.15
floating_share = 1.0
maturity_year = 2028 # March 2028; repaid in quarterly instalments
recourse = true

[[debt_facilities]]
name = "DDTL 2.0"
principal = 3190
effective_rate = 0.11
floating_share = 1.0
maturity_year = 2030 # August 2030; quarterly instalments from Jan 2026
recourse = true

[[debt_facilities]]
name = "DDTL 2.1"
principal = 3000
effective_rate = 0.09
floating_share = 1.0 # SOFR + 4.25% [10-K FY25]
maturity_year = 2031 # March 2031; quarterly instalments from July 2026
recourse = true

[[debt_facilities]]
name = "DDTL 3.0"
principal = 2215
effective_rate = 0.09
floating_share = 1.0 # SOFR + 4.00% [10-K FY25]; lenders require swaps fixing at least 75% of it
maturity_year = 2030 # August 2030; monthly instalments from April 2026
recourse = true

[[debt_facilities]]
name = "DDTL 4.0"
principal = 2837
