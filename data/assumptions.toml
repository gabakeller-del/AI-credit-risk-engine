[base_case]
# Phase 2: the "most likely" year, before any stress. These are OUR CHOICES, built from the
# numbers above. Change them here to see how the result moves.

year = 2026

# Revenue: the code uses the midpoint of the FY2026 guidance range ([revenue] section above).

# EBITDA margin: assume the rest of 2026 looks like the latest quarter (Q2 2026 = 59%).
ebitda_margin = 0.59 # from [operating_costs] adjusted_ebitda_margin_q2_2026

# Capex: the code uses the midpoint of the FY2026 capex guidance ([capex] section above).

# Cash taxes: OUR ASSUMPTION. CoreWeave makes accounting losses (net loss of $1.2B in 2025),
# so it pays very little income tax. We assume zero for now.
cash_taxes = 0

# Interest: SIMPLIFICATION. We charge each loan's effective rate on its 30 June 2026 balance
# for a full year. Real 2026 interest will be lower (debt was smaller in early 2026), so this
# slightly overstates it. We'll model balances changing over time in Phase 3.


[projection]
# Phase 3: 2026-2030. Lists below have one value per year, in order: [2026, 2027, 2028, 2029, 2030].
#
# TIMING: the model starts on 30 June 2026 (the latest balance sheet), so the first period is
# only JULY-DECEMBER 2026. The code works out the second half of 2026 as
#   full-year figure (guidance midpoint) MINUS what already happened in January-June (actuals).
# The 2026 values in the lists below are FULL-YEAR figures; the code does the subtraction.

# Length of each period in years: 0.5 for July-Dec 2026, then full years.
# Interest is charged for this fraction of a year.
period_length = [0.5, 1.0, 1.0, 1.0, 1.0]
#
# Source for the 2027 anchor:
#   [Consensus Oct26] Analyst average 2027 revenue ~$26.3B (range $21.1B-$31.0B), per Yahoo
#   Finance / StockAnalysis analyst tables, Oct 2026. 2028 forecasts vary a lot ($29B-$43B).

years = [2026, 2027, 2028, 2029, 2030]

# Revenue growth vs the year before. 2026 is the guidance midpoint, so its growth isn't used.
# 2027: +105% gets us to ~$26.3B = [Consensus Oct26].
# 2028-2030: OUR ASSUMPTION. Growth slows as the backlog converts and the build-out matures
# (deliberately below the most bullish 2028 forecasts).
revenue_growth = [0.0, 1.05, 0.35, 0.20, 0.10]

# EBITDA margin: OUR ASSUMPTION. Held at the Q2 2026 level (59%) every year.
ebitda_margin = [0.59, 0.59, 0.59, 0.59, 0.59]

# Capex ($ millions). 2026 = full-year guidance midpoint [Q2 FY26 call]. The code subtracts the
# $14.1B of cash capex already spent in Jan-June (Q1 7,695 + Q2 6,422), leaving ~$22.9B for
# July-Dec. (Guidance may use a slightly wider capex definition than cash paid, so this is
# on the cautious side: it assumes more cash still has to go out in the second half.)
# 2027-2030: OUR ASSUMPTION. Rule of thumb from 2026: ~$2.7 of capex buys ~$1 of extra yearly
# revenue the following year ($37B capex in 2026 -> ~$13.5B more revenue in 2027).
# Applying that to our growth path gives roughly 25B, 19.5B, 12B, then a $10B floor in 2030
# to cover replacing GPUs that wear out.
capex = [37000, 25000, 19500, 12000, 10000]

# Cash taxes: OUR ASSUMPTION. Zero, as in the base case (accounting losses, big depreciation).
cash_taxes = [0, 0, 0, 0, 0]

# New borrowing: whenever cash would fall below the minimum, CoreWeave borrows the difference.
# Interest rate on that new debt: OUR ASSUMPTION, based on its 2026 bond deals
# (9.75% and 9.625% USD notes, 8.50% EUR notes [10-Q Q2 FY26]).
new_debt_rate = 0.095

# Minimum cash: OUR ASSUMPTION. A safety buffer CoreWeave won't let cash fall below.
minimum_cash = 2000

# SIMPLIFICATIONS (we'll revisit these):
# - Interest on new borrowing starts the year AFTER it's borrowed.
# - New borrowing isn't repaid within the 5 years.
# - No new shares (equity) are issued; all funding gaps are filled with debt.


[default_rules]
# Phase 4: when does CoreWeave count as "in default"? These are OUR ASSUMPTIONS: the 10-K says
# CoreWeave has "specified financial covenant ratios" but doesn't publish the numbers.

# 1. BORROWING LIMIT. Lenders stop lending once total debt would exceed this many times
#    NEXT year's EBITDA. ~6x is a common ceiling for risky (non-investment-grade) borrowers.
#    We use next year's EBITDA because GPU lenders lend against the contracted revenue the new
#    GPUs will earn. In the final projection year (no "next year"), we use that year's EBITDA.
max_forward_leverage = 6.0

#    If CoreWeave needs more cash than lenders will provide, and its cash would fall below zero,
#    it can't pay its bills = LIQUIDITY DEFAULT.

# 2. INTEREST COVER COVENANT. If EBITDA / interest falls below this, the covenant is breached
#    = COVENANT DEFAULT. 1.5x is a typical level in loan agreements.
min_interest_cover = 1.5


[monte_carlo]
# Phase 5: run the projection many times, each with random surprises, and count the defaults.
# "stdev" = standard deviation = the typical size of a surprise. About 2/3 of random draws land
# within 1 stdev of the centre, about 95% within 2 stdevs. All are OUR ASSUMPTIONS.

n_simulations = 10000

# Seed = the starting point for the random number generator. Using the same seed gives the
# same "random" futures every run, so results can be checked and compared.
# Change it to see a different batch of futures.
seed = 42

# Revenue growth surprise, added to each year's growth in [projection].revenue_growth.
# 2027: +/- 20 points, because analysts' 2027 forecasts span ~$21-31B (~+65% to +142% growth) [Consensus Oct26].
# 2028-2030: +/- 10 points a year.
# (The Jul-Dec 2026 period isn't random: it's mostly already contracted, and guidance is recent.)
revenue_growth_stdev = [0.0, 0.20, 0.10, 0.10, 0.10]
min_revenue_growth = -0.50 # growth can't be worse than -50% in a year (keeps draws realistic)

# EBITDA margin surprise: +/- 4 points around [projection].ebitda_margin, drawn once per future
# (a business that runs less efficiently tends to stay that way).
# Recent margins: Q1 2026 56%, Q2 2026 59%, FY2025 60% [Q1/Q2 FY26 PR, Q4 FY25 PR].
ebitda_margin_stdev = 0.04

# Interest rate on NEW debt: +/- 1.5 points around [projection].new_debt_rate, drawn once per future.
# 2026 bond deals ranged 8.50%-9.75% [10-Q Q2 FY26], and credit markets can move quickly.
new_debt_rate_stdev = 0.015
min_new_debt_rate = 0.05 # rates can't fall below 5% (roughly risk-free rate + a small margin)

# SIMPLIFICATIONS:
# - Surprises are independent (in reality a weak economy might lower growth AND raise rates together).
# - Capex is NOT random: the GPUs are already ordered, so CoreWeave pays for them even if revenue disappoints.
